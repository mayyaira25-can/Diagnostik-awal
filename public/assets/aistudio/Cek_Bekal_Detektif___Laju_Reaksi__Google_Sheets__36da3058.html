<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cek Bekal Detektif – Diagnostik Laju Reaksi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f3ff;--card:#fff;--tx:#1f1b3a;--mut:#6b6788;--pri:#6d28d9;--pri2:#ede9fe;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--mid:#b45309;--midb:#fef3c7;--bd:#ddd6fe}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17132b;--card:#221d3f;--tx:#f1eefc;--mut:#a9a3c9;--pri:#a78bfa;--pri2:#33295e;--ok:#86efac;--okb:#14391f;--bad:#fca5a5;--badb:#44181b;--mid:#fcd34d;--midb:#42310a;--bd:#3b3366}}
:root[data-theme="dark"]{--bg:#17132b;--card:#221d3f;--tx:#f1eefc;--mut:#a9a3c9;--pri:#a78bfa;--pri2:#33295e;--ok:#86efac;--okb:#14391f;--bad:#fca5a5;--badb:#44181b;--mid:#fcd34d;--midb:#42310a;--bd:#3b3366}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}h2{font-size:18px;margin:0 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.m{color:var(--mut);font-size:14px}
select,input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin:4px 0 10px}
button{font:inherit;cursor:pointer}
.b{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:13px 18px;width:100%;font-weight:600}
.b:disabled{opacity:.4}
.o{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:13px;margin:8px 0}
.o.s{border-color:var(--pri);background:var(--pri2)}
.bar{height:8px;background:var(--pri2);border-radius:8px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--pri)}
.tag{display:inline-block;border-radius:20px;padding:3px 12px;font-weight:700;font-size:14px}
.ok{background:var(--okb);color:var(--ok)}.mid{background:var(--midb);color:var(--mid)}.bad{background:var(--badb);color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}.tabs .a{background:var(--pri);color:#fff}
.sc{overflow-x:auto}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chips button{padding:7px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}.chips .a{background:var(--pri);color:#fff;border-color:var(--pri)}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
var Q=[
{k:"kesiapan",t:"Pertanyaan kesiapan: Saya merasa … belajar kecepatan reaksi hari ini.",o:["siap","cukup siap","perlu dibantu"],info:true},
{k:"mol",t:"Berapa mol 2,4 g Mg? (Ar Mg = 24)",o:["0,01 mol","0,1 mol","1 mol","57,6 mol"],a:1},
{k:"molaritas",t:"Berapa molaritas larutan yang mengandung 0,2 mol HCl dalam 500 mL larutan?",o:["0,1 M","0,4 M","4 M","100 M"],a:1},
{k:"grafik",t:"Konsentrasi zat A turun dari 0,8 M (t = 0 s) menjadi 0,5 M (t = 10 s). Berapa penurunannya?",o:["0,3 M","1,3 M","0,03 M","0,5 M"],a:0},
{k:"grafik",t:"Pada grafik konsentrasi terhadap waktu, garis yang lebih curam menunjukkan reaksi yang …",o:["lebih cepat","lebih lambat","sama saja","tidak dapat ditentukan"],a:0},
{k:"luas",t:"Gula pasir dan gula halus dilarutkan dalam air yang sama. Mana yang lebih cepat larut?",o:["Gula pasir","Gula halus","Sama cepat","Bergantung jenis gula"],a:1},
{k:"luas",t:"Alasan yang paling tepat untuk jawabanmu pada soal sebelumnya adalah …",o:["Gula halus lebih manis","Luas permukaan gula halus lebih besar, sehingga lebih banyak partikel yang bertumbukan","Gula halus lebih ringan","Gula halus lebih murni"],a:1}
];
var ASP={mol:"Konsep mol",molaritas:"Molaritas",grafik:"Grafik & laju",luas:"Luas permukaan (faktor laju)"};
var TL={mol:"Beri pengingat rumus mol; pasangkan dengan tutor sebaya.",molaritas:"Beri pengingat rumus molaritas; pasangkan dengan tutor sebaya.",grafik:"Tangani saat guru menjelaskan kemiringan grafik.",luas:"Jadikan bahan prediksi dan koreksi pada tahap Predict."};
var KELAS=["XI MIPA 1","XI MIPA 2","XI MIPA 3","XI MIPA 4","XI MIPA 5","XI MIPA 6"];
var URL_SCRIPT="https://script.google.com/macros/s/AKfycbzljAwg5bzpQ2JnPurI9xrzJzQxieFl5yaAYCbOguh9E2Yl8tNlsUnluIwan1aBDjKI/exec";/* tempel URL Apps Script (Web App) di sini */
var S={f:"Semua",err:false,step:-1,ans:[],nama:"",kelas:"",tab:"siswa",res:null,sent:null,all:[],isOwner:true,db:null,uid:null};
var $=function(h){document.getElementById("app").innerHTML=h};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hitung(a){
  var per={},skor=0,tot=0;
  Q.forEach(function(q,i){if(q.info)return;per[q.k]=per[q.k]||{b:0,n:0};per[q.k].n++;tot++;if(a[i]===q.a){per[q.k].b++;skor++}});
  var lemah=Object.keys(per).filter(function(k){return per[k].b<per[k].n});
  var lv=skor>=5&&per.mol.b+per.molaritas.b===2?"Siap Tantangan":(skor>=3?"Cukup Siap":"Perlu Pendampingan");
  return{skor:skor,tot:tot,per:per,lemah:lemah,level:lv,kes:Q[0].o[a[0]]};
}
function cls(l){return l==="Siap Tantangan"?"ok":l==="Cukup Siap"?"mid":"bad"}
function mulai(){
  $('<h1>🔍 Cek Bekal Detektif</h1><p class="m">Diagnostik awal Laju Reaksi. Tidak dinilai: tujuannya memetakan kesiapan belajar, jadi jawab jujur ya.</p>'+
  '<div class="c"><label>Nama<input type="text" id="n" autocomplete="off" value="'+esc(S.nama)+'"></label><label>Kelas<select id="k"><option value="">Pilih kelas</option>'+KELAS.map(function(k){return'<option'+(S.kelas===k?' selected':'')+'>'+k+'</option>'}).join('')+'</select></label>'+
  '<button class="b" id="go">Mulai</button></div>'+(S.isOwner?'<button class="b" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" id="gt">Buka pemetaan kelas (guru)</button>':''));
  document.getElementById("go").onclick=function(){S.nama=document.getElementById("n").value.trim();S.kelas=document.getElementById("k").value.trim();if(!S.nama){document.getElementById("n").focus();return}if(!S.kelas){document.getElementById("k").focus();return}S.step=0;S.ans=[];soal()};
  var g=document.getElementById("gt");if(g)g.onclick=mulaiGuru;
}
function soal(){
  var q=Q[S.step],p=Math.round(S.step/Q.length*100);
  $('<div class="bar"><i style="width:'+p+'%"></i></div><p class="m">Soal '+(S.step+1)+' dari '+Q.length+'</p><div class="c"><h2>'+esc(q.t)+'</h2>'+
  q.o.map(function(o,i){return'<button class="o'+(S.ans[S.step]===i?' s':'')+'" data-i="'+i+'">'+esc(o)+'</button>'}).join('')+'</div>'+
  '<button class="b" id="nx" '+(S.ans[S.step]===undefined?'disabled':'')+'>'+(S.step===Q.length-1?'Lihat hasil':'Lanjut')+'</button>');
  Array.prototype.forEach.call(document.querySelectorAll(".o"),function(b){b.onclick=function(){S.ans[S.step]=+b.dataset.i;soal()}});
  document.getElementById("nx").onclick=function(){if(S.step===Q.length-1){selesai()}else{S.step++;soal()}};
}
function kirim(){
  S.sent=null;hasil();var r=S.res;
  var body=JSON.stringify({kelas:S.kelas,nama:S.nama.replace(/[|\n]/g," "),ans:"j"+S.ans.join(""),skor:r.skor,tot:r.tot,level:r.level,lemah:r.lemah.map(function(k){return ASP[k]})});
  if(!URL_SCRIPT){S.sent=false;hasil();return}
  fetch(URL_SCRIPT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:body}).then(function(){S.sent=true;hasil()},function(){S.sent=false;hasil()});
}
function selesai(){S.res=hitung(S.ans);kirim()}
function ambil(){
  var y=window.scrollY;
  function tampil(){if(S.tab==="guru"){guru();window.scrollTo(0,y)}}
  if(!URL_SCRIPT){S.err="URL Apps Script belum diisi di file";tampil();return}
  if(!S.pin)return;
  fetch(URL_SCRIPT+"?pin="+encodeURIComponent(S.pin)).then(function(r){return r.json()}).then(function(v){
    if(v&&v.error){S.err="PIN salah";S.pin=null;tampil();return}
    var n=v.map(function(x){var a=String(x.ans).replace(/^j/,"").split("").map(Number);
      if(a.length!==Q.length||!a.every(Number.isInteger)||a[0]<0||a[0]>2)return null;
      var r=hitung(a);return{nama:String(x.nama),kelas:String(x.kelas),skor:r.skor,tot:r.tot,level:r.level,lemah:r.lemah,kes:r.kes,per:r.per}}).filter(Boolean);
    var j=JSON.stringify(n);
    if(j!==S.last||S.err){S.last=j;S.all=n;S.err="";tampil()}
  }).catch(function(){if(!S.err){S.err="tidak bisa mengambil data (cek internet atau URL)";tampil()}});
}
function mulaiGuru(){
  var p=S.pin||prompt("Masukkan PIN guru");if(!p)return;
  S.pin=p;S.tab="guru";S.err="";guru();ambil();
  if(!S.tm)S.tm=setInterval(function(){if(S.tab==="guru")ambil()},5000);
}
function hasil(){
  var r=S.res;
  $('<h1>Hasil pemetaanmu</h1><p class="m">'+esc(S.nama)+(S.kelas?' · '+esc(S.kelas):'')+'</p>'+
  '<div class="c"><span class="tag '+cls(r.level)+'">'+r.level+'</span><p style="font-size:28px;margin:8px 0 0"><b>'+r.skor+'</b> / '+r.tot+' tepat</p><p class="m">Kesiapan diri: saya merasa '+esc(r.kes)+'</p></div>'+
  '<div class="c"><h2>Per kemampuan prasyarat</h2>'+Object.keys(r.per).map(function(k){var p=r.per[k],ok=p.b===p.n;return'<div class="row"><span>'+ASP[k]+'</span><span class="tag '+(ok?'ok':p.b?'mid':'bad')+'">'+p.b+'/'+p.n+'</span></div>'}).join('')+'</div>'+
  '<div class="c"><h2>Tindak lanjut</h2>'+(r.lemah.length?'<ul>'+r.lemah.map(function(k){return'<li><b>'+ASP[k]+':</b> '+TL[k]+'</li>'}).join('')+'</ul>':'<p>Semua tepat. Kelompokmu akan mendapat tantangan menghubungkan dua faktor pada “Insinyur Kimia Cilik”.</p>')+'</div>'+
  '<div class="c"><p>'+(S.sent===true?"✅ Hasilmu sudah terkirim ke guru.":S.sent===false?"⚠️ Hasil belum terkirim. Pastikan internet aktif, lalu ketuk Kirim ulang.":"Mengirim hasil…")+'</p>'+(S.sent===false?'<button class="b" id="rt">Kirim ulang</button>':'')+'</div>'+
  '<button class="b" id="ul">Ulangi</button>');
  document.getElementById("ul").onclick=function(){S.step=-1;mulai()};
  var rt=document.getElementById("rt");if(rt)rt.onclick=kirim;
}
function guru(){
  var all=S.all,d=all.filter(function(x){return S.f==="Semua"||x.kelas===S.f}),n=d.length;
  var gr={"Siap Tantangan":[],"Cukup Siap":[],"Perlu Pendampingan":[]};d.forEach(function(x){(gr[x.level]=gr[x.level]||[]).push(x)});
  var asp=Object.keys(ASP).map(function(k){var b=0,t=0;d.forEach(function(x){if(x.per&&x.per[k]){b+=x.per[k].b;t+=x.per[k].n}});return{k:k,p:t?Math.round(b/t*100):0,sal:d.filter(function(x){return(x.lemah||[]).indexOf(k)>-1}).length}});
  var kes={};d.forEach(function(x){kes[x.kes]=(kes[x.kes]||0)+1});
  var chips='<div class="chips">'+["Semua"].concat(KELAS).map(function(k){var c=k==="Semua"?all.length:all.filter(function(x){return x.kelas===k}).length;return'<button data-f="'+k+'"'+(S.f===k?' class="a"':'')+'>'+(k==="Semua"?"Semua":k.replace("XI ",""))+' ('+c+')</button>'}).join('')+'</div>';
  var ov=S.f==="Semua"?'<div class="c sc"><h2>Ringkasan per kelas</h2>'+KELAS.map(function(k){var z=all.filter(function(x){return x.kelas===k}),c=function(l){return z.filter(function(x){return x.level===l}).length},av=z.length?(z.reduce(function(a,x){return a+x.skor},0)/z.length).toFixed(1):"-";return'<div class="row"><span><b>'+k+'</b><br><span class="m">'+z.length+' siswa · rata-rata skor '+av+'</span></span><span><span class="tag bad">'+c("Perlu Pendampingan")+'</span> <span class="tag mid">'+c("Cukup Siap")+'</span> <span class="tag ok">'+c("Siap Tantangan")+'</span></span></div>'}).join('')+'<p class="m">Merah = perlu pendampingan, kuning = cukup siap, hijau = siap tantangan.</p></div>':'';
  $('<h1>Pemetaan kelas</h1><p class="m">'+all.length+' siswa sudah masuk (diperbarui otomatis tiap 5 detik)'+(S.err?' · ⚠️ '+esc(S.err):'')+'</p>'+
  '<div class="tabs"><button id="t1">Mengisi</button><button class="a">Pemetaan</button></div>'+chips+ov+
  '<div class="c"><h2>Kelompok kesiapan'+(S.f==="Semua"?'':' · '+S.f)+'</h2>'+["Perlu Pendampingan","Cukup Siap","Siap Tantangan"].map(function(l){return'<div class="row" style="align-items:flex-start"><span class="tag '+cls(l)+'">'+l+' ('+gr[l].length+')</span><span class="m" style="text-align:right">'+gr[l].map(function(x){return esc(x.nama)}).join(", ")+'</span></div>'}).join('')+'</div>'+
  '<div class="c"><h2>Ketepatan per prasyarat</h2>'+asp.map(function(a){return'<div class="row"><span>'+ASP[a.k]+'<br><span class="m">'+a.sal+' siswa perlu penguatan</span></span><span class="tag '+(a.p>=70?'ok':a.p>=40?'mid':'bad')+'">'+(n?a.p+'%':'-')+'</span></div>'}).join('')+'</div>'+
  '<div class="c"><h2>Kesiapan diri</h2>'+(Object.keys(kes).map(function(k){return'<div class="row"><span>Saya merasa '+esc(k)+'</span><b>'+kes[k]+'</b></div>'}).join('')||'<p class="m">Belum ada data.</p>')+'</div>'+
  '<div class="c"><h2>Saran pembentukan kelompok</h2><p class="m">Pasangkan siswa “Siap Tantangan” sebagai tutor sebaya dengan siswa yang lemah pada mol atau molaritas. Siswa yang lemah di grafik atau luas permukaan ditangani saat penjelasan guru dan tahap Predict.</p></div>'+
  '<div class="c sc"><h2>Rincian siswa</h2>'+(d.slice().sort(function(a,b){return b.skor-a.skor}).map(function(x){return'<div class="row"><span>'+esc(x.nama)+' <span class="m">'+esc(x.kelas||"")+'</span><br><span class="m">'+(x.lemah||[]).map(function(k){return ASP[k]}).join(", ")+'</span></span><span class="tag '+cls(x.level)+'">'+x.skor+'/'+x.tot+'</span></div>'}).join('')||'<p class="m">Belum ada siswa.</p>')+'</div>');
  document.getElementById("t1").onclick=function(){S.tab="siswa";S.step=-1;mulai()};
  Array.prototype.forEach.call(document.querySelectorAll(".chips button"),function(b){b.onclick=function(){S.f=b.dataset.f;guru()}});
}
mulai();
</script>
</body>
</html>
